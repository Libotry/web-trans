<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 双语阅读</title><link rel="stylesheet" href="pdf.css"></head>
<body><header><div><h1>PDF 双语阅读</h1><p>英语 → 简体中文 · 自带 API</p></div><div class="row"><button id="settings">设置 API</button><label class="file-button" for="file">打开 PDF</label><input id="file" type="file" accept="application/pdf,.pdf"></div></header>
<main><section id="intro" class="intro"><h2>导入文字版 PDF，逐页双语阅读</h2><p>点击“打开 PDF”，或将文件拖到此页面。PDF 在本地解析；点击翻译后，仅将待翻译文字发送给你配置的模型服务。</p><p>支持最大 50 MiB、500 页。扫描件需要 OCR，当前版本暂不支持。</p><p><strong>刷新或关闭页面后需重新选择文件，阅读结果不会永久保存。</strong> Chrome 内置阅读器中打开的文件，请先保存到本地再导入。</p></section>
<section id="reader" hidden><div class="toolbar"><strong id="filename"></strong><span id="pageCount"></span><div class="row"><button id="prev">上一页</button><label>页码 <input id="pageNumber" type="number" min="1" value="1"></label><button id="next">下一页</button><label>缩放 <select id="zoom"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div></div>
<div class="actions row"><button id="translate" class="primary">翻译当前页</button><button id="pause">暂停</button><button id="stop">停止</button><button id="retry">重试失败项</button><button id="extend" hidden>增加额度</button><button id="clear">清除本文件译文</button><label><input id="auto" type="checkbox"> 翻页后自动翻译</label></div>
<p id="stats" class="stats"></p><p id="warning" class="warning"></p><div class="panes"><section class="pdf-pane" aria-label="原始 PDF"><h2>原始 PDF</h2><div id="canvasHost"><canvas id="canvas"></canvas><div id="highlights" aria-hidden="true"></div></div></section><section class="text-pane" aria-label="段落对照"><h2 id="textTitle">段落对照</h2><div id="blocks"></div></section></div></section>
<p id="status" role="status" aria-live="polite">请选择一个 PDF 文件。</p></main>
<dialog id="passwordDialog"><form id="passwordForm"><h2>PDF 需要密码</h2><p id="passwordHint">密码仅在本页临时使用，不会发送给模型服务。</p><label>密码 <input id="password" type="password" autocomplete="off" required></label><div class="row"><button type="submit" class="primary">打开</button><button id="passwordCancel" type="button">取消</button></div></form></dialog>
<script type="module" src="pdf.js"></script></body></html>
